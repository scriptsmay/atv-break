name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform and build-tools
        run: |
          SDKM=$(command -v sdkmanager \
            || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "using sdkmanager: $SDKM"
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: atv-break-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: atv-break-release-apk
          path: apk

      - name: Create draft GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 故意只建草稿：产物有问题时不会立刻对外可下载，核对无误后手动 Publish
          mv apk/app-release.apk "atv-break-${TAG}.apk"
          gh release create "$TAG" "atv-break-${TAG}.apk" \
            --title "atv-break ${TAG}" \
            --generate-notes \
            --draft
