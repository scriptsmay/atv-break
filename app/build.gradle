plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atvbreak'
    compileSdk 34

    defaultConfig {
        applicationId "com.atvbreak"
        minSdk 21          // Android 5.0，覆盖主流电视盒子
        targetSdk 34
        versionCode 4
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 纯本地自用：release 直接复用 debug 签名，无需配置正式签名
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 运行时无第三方依赖：只用 Android 框架 API（org.json 为框架内置）。
    // JUnit 仅用于本地单元测试（testImplementation，不会打进 APK）。
    testImplementation 'junit:junit:4.13.2'
    // 本地单测需要真实的 org.json 实现（android.jar 里的是抛异常的桩）
    testImplementation 'org.json:json:20240303'
}
